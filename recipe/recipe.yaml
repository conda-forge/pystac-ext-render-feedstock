schema_version: 1

context:
  version: "2.0.1"

package:
  name: pystac-ext-render
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pystac-ext-render/pystac_ext_render-${{ version }}.tar.gz
  sha256: 04e908e3571f83df2201da07c2b4ae5e6a7140fd202fdd5703907b1178b09f5c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pystac-core

tests:
  - python:
      imports:
        - pystac.extensions.render
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Render extension for PySTAC
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pystac-ext-render/
  documentation: https://pystac.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
